services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: tytalk
      MYSQL_USER: tytalk
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tytalk}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD:-root} --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: mysql+pymysql://tytalk:${MYSQL_PASSWORD:-tytalk}@mysql:3306/tytalk
      HTTP_BODY_LOG: "true"
    ports:
      - "8000:8000"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log 2>&1 | tee -a /app/logs/api.log"
    volumes:
      - ./logs:/app/logs
      - ./models:/app/models:ro
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  mysql_data:
