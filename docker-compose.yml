services:
  api:
    build: ./backend
    env_file: .env
    environment:
      HTTP_BODY_LOG: "true"
      TESTER_LOGIN_ENABLED: "true"
      TTS_MODEL_DIR: /app/models/tiny-voca
    ports:
      - "8000:8000"
    command: sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log 2>&1 | tee -a /app/logs/api.log"
    volumes:
      - ./logs:/app/logs
      - ./models:/app/models:ro
      - ./backend/data:/app/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build: ./frontend
    environment:
      VITE_API_TARGET: http://api:8000
    ports:
      - "5174:5174"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
    depends_on:
      api:
        condition: service_healthy
