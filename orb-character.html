<title>TyTalk Orb</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap">
<style>
  :root { --bg:#07070c; --panel:#0e0d16; --line:#25233a; --fg:#ecebf7; --dim:#8c8aa6; --glow:#8a5cff;
    --font-display:"Space Grotesk","Helvetica Neue",Arial,sans-serif; --font-body:"Inter",system-ui,sans-serif; --font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace; color-scheme:dark; }
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;padding-block:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .wrap{max-width:1080px;margin:0 auto;display:grid;gap:24px;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
  @media(max-width:820px){.wrap{grid-template-columns:minmax(0,1fr)}}
  header{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px}
  h1{font-family:var(--font-display);font-size:clamp(26px,5vw,38px);margin:0;letter-spacing:-.02em}
  header p{margin:0;color:var(--dim);max-width:48ch}
  .stage{position:relative;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:radial-gradient(120% 90% at 50% 40%,#12101d 0%,#08080e 70%);display:flex;flex-direction:column}
  .orb{width:min(100%,460px);margin:0 auto;padding:12px 16px 0}
  .badge{position:absolute;left:14px;top:14px;font-family:var(--font-mono);font-size:12px;color:var(--dim);display:flex;align-items:center;gap:8px}
  .badge i{width:8px;height:8px;border-radius:50%;background:var(--glow);box-shadow:0 0 10px var(--glow);transition:background .5s,box-shadow .5s}
  .tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:6px 14px 16px}
  button{font:500 14px var(--font-body);color:var(--fg);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;transition:background .2s,border-color .2s}
  button:hover{background:rgba(255,255,255,.09)}
  button:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
  button[aria-pressed="true"]{border-color:var(--glow);background:color-mix(in srgb,var(--glow) 22%,transparent)}
  button kbd{font:400 11px var(--font-mono);color:var(--dim);margin-left:6px}
  .side{display:flex;flex-direction:column;gap:16px;min-width:0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
  .card h2{font:500 12px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:0 0 10px}
  #name{font-family:var(--font-display);font-size:24px;margin:0 0 4px}
  #desc{margin:0 0 14px;color:var(--dim)}
  dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
  dt{color:var(--dim)} dd{margin:0;font-family:var(--font-mono);font-size:12.5px;min-width:0;overflow-wrap:anywhere}
  canvas{width:100%;height:150px;display:block}
  .legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font:400 12px var(--font-mono);color:var(--dim)}
  .legend span::before{content:"";display:inline-block;width:14px;height:2px;margin-right:6px;vertical-align:middle;background:var(--c)}
  .auto{display:flex;align-items:center;justify-content:space-between;gap:12px}

  .flow{grid-column:1/-1}
  .flow-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;margin-bottom:12px}
  .flow-head h2{margin:0}
  .flow-ctl{display:flex;flex-wrap:wrap;gap:8px}
  .chain{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .chip{position:relative;width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:0;border-radius:12px;padding:10px 12px 14px;text-align:left;overflow:hidden}
  .chip-n{font:500 14px var(--font-display)}
  .chip-d{font-size:12px;color:var(--dim)}
  .chip-bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.08)}
  .chip-bar div{height:100%;width:0;background:var(--glow)}
</style>
<style>.tyorb{display:block;overflow:visible;--orb-glow: #8a5cff;--orb-glow2: #c0389a}.tyorb-layer{opacity:0;transition:opacity .28s ease}.tyorb[data-eyes=pill] .tyorb-pill,.tyorb[data-eyes=arcUp] .tyorb-arcUp,.tyorb[data-eyes=arcDown] .tyorb-arcDown,.tyorb[data-eyes=angry] .tyorb-angry,.tyorb[data-eyes=laugh] .tyorb-laugh,.tyorb[data-eyes=dizzy] .tyorb-dizzy,.tyorb[data-state=surprised] .tyorb-brows,.tyorb[data-state=cute] .tyorb-cheek,.tyorb[data-state=laugh] .tyorb-cheek,.tyorb[data-state=cute] .tyorb-spark,.tyorb[data-state=sleepy] .tyorb-zzz,.tyorb[data-state=working] .tyorb-orbit{opacity:1}.tyorb-eye{fill:#f3f0ff}.tyorb-stroke{fill:none;stroke:#f3f0ff;stroke-linecap:round;stroke-linejoin:round}.tyorb-glow{fill:var(--orb-glow);transition:fill .6s ease}.tyorb-tint{fill:var(--orb-glow2);transition:fill .6s ease}.tyorb-cheek ellipse{fill:var(--orb-glow2)}.tyorb-orbit-arc{fill:none;stroke:var(--orb-glow);stroke-width:3;stroke-linecap:round;transition:stroke .6s}.tyorb-pillbox{transform-box:fill-box;transform-origin:center}.tyorb-star{animation:tyorb-twinkle 3.2s ease-in-out infinite}.tyorb-spark-item{transform-box:fill-box;transform-origin:center;animation:tyorb-spark 1.6s ease-in-out infinite}.tyorb-z{fill:#cfc8ff;font:700 20px system-ui,sans-serif;opacity:0;animation:tyorb-z 3s ease-in-out infinite}.tyorb-z:nth-child(2){animation-delay:1s}.tyorb-z:nth-child(3){animation-delay:2s}@keyframes tyorb-twinkle{0%,to{opacity:.15}50%{opacity:.9}}@keyframes tyorb-spark{0%,to{transform:scale(.3) rotate(0);opacity:0}50%{transform:scale(1) rotate(45deg);opacity:1}}@keyframes tyorb-z{0%{opacity:0;transform:translate(0)}30%{opacity:.9}to{opacity:0;transform:translate(14px,-26px)}}@media(prefers-reduced-motion:reduce){.tyorb-star,.tyorb-spark-item,.tyorb-z{animation:none}}
</style>
